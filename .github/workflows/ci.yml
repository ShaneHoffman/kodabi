name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pure Node work — runs on Linux (~half the billed rate of Windows, faster to
  # boot). The Vite output is platform-independent, so dist/ is built once here
  # and shared with the Rust jobs as an artifact instead of being rebuilt in
  # each of them.
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (strict — warnings fail)
        run: pnpm exec eslint . --max-warnings=0
      - name: Build (typecheck + Vite)
        run: pnpm build
      - name: Upload dist/ for the Rust jobs (generate_context! embeds it)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # clippy and test each force a full dependency recompile (clippy compiles
  # through the clippy-driver wrapper, which doesn't share a cache fingerprint
  # with a plain rustc build), so they run as separate parallel jobs instead
  # of sequential steps in one job — otherwise every run pays for both full
  # compiles back-to-back instead of overlapping them. Both need dist/ to
  # exist (src-tauri embeds it via tauri::generate_context!), downloaded from
  # the frontend job rather than rebuilt.
  #
  # CI does not build the Tauri app — the release compile is the slowest step,
  # and the workspace's two smoke tests don't justify paying it per push.
  # Whether the desktop app itself builds is verified by the /pull-request
  # skill before a PR is opened or updated (see .claude/skills/pull-request).
  lint:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download dist/ (built by the frontend job)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (strict — warnings fail)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust (test)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download dist/ (built by the frontend job)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Test
        run: cargo test --workspace --locked

  # kodama-transcribe's `parakeet` feature pulls in sherpa-onnx (a native ONNX
  # dependency), so it's off by default and invisible to the `lint`/`test`
  # jobs' `--workspace` runs above. This job clippy/build-checks it with the
  # feature on instead, so the FFI glue can't silently rot between the rare
  # times someone runs it locally. Path-filtered to only fire on changes to
  # the crate, and skips `--locked`'s dist/ dependency — this crate never
  # touches `tauri::generate_context!`. sherpa-onnx's default `static` feature
  # downloads a prebuilt archive (no cmake/C++ toolchain needed), so the only
  # extra cost here is that one-time (cached) download.
  parakeet:
    name: Rust (parakeet engine)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes under crates/kodama-transcribe
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          # Run git diff outside the `if` condition so a failure (e.g. an
          # unreachable base commit) aborts the step under `set -e` instead of
          # being read as "no changes" and silently skipping the parakeet gate.
          changed="$(git diff --name-only "$base" HEAD -- crates/kodama-transcribe)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (stable) + clippy
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Clippy (feature parakeet — strict, warnings fail)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy -p kodama-transcribe --features parakeet --all-targets --locked -- -D warnings
