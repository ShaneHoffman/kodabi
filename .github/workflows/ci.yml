name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # dist/ is the one thing every Rust job actually waits for: src-tauri embeds
  # it at compile time via tauri::generate_context!, so it must exist before
  # cargo runs. The Vite output is platform-independent, so it is built once
  # here on Linux (~half the billed rate of Windows, faster to boot) and shared
  # as an artifact instead of being rebuilt in each Windows job.
  #
  # Building it is deliberately *all* this job does. eslint and vitest sit in a
  # sibling job (`frontend`) rather than in steps here, because the Windows jobs
  # want the artifact and nothing else — folding the lint/test work back in
  # would put ~20s of it on the critical path of every Rust job for no benefit.
  # `pnpm build` is `tsc -b && vite build`, so the typecheck gate lives here and
  # is not duplicated next door.
  dist:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (typecheck + Vite)
        run: pnpm build
      - name: Upload dist/ for the Rust jobs (generate_context! embeds it)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The pure-Node gates. Nothing downstream needs them, so they run beside
  # `dist` instead of upstream of it and cost no wall-clock anywhere else. The
  # duplicated `pnpm install` is a few seconds of Linux minutes off the critical
  # path — the price of not making the Rust jobs wait on eslint.
  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (strict — warnings fail)
        run: pnpm exec eslint . --max-warnings=0
      - name: Test (vitest, jsdom)
        run: pnpm test

  # clippy and test each force a full dependency recompile (clippy compiles
  # through the clippy-driver wrapper, which doesn't share a cache fingerprint
  # with a plain rustc build), so they run as separate parallel jobs instead
  # of sequential steps in one job — otherwise every run pays for both full
  # compiles back-to-back instead of overlapping them. Both need dist/ to
  # exist (src-tauri embeds it via tauri::generate_context!), downloaded from
  # the `dist` job rather than rebuilt.
  #
  # These two jobs build the app with default features, i.e. the stub
  # MockEngine — the shipping configuration (`--features parakeet`) is built
  # and exercised by the `app-dev` and `app` jobs at the bottom of this file,
  # path-filtered so the slow release compile only runs when a Rust surface
  # changes. The /pull-request skill still release-builds the app
  # unconditionally before a PR is opened or updated (see
  # .claude/skills/pull-request).
  lint:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: dist
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download dist/ (built by the dist job)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (strict — warnings fail)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust (test)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: dist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download dist/ (built by the dist job)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Test
        run: cargo test --workspace --locked

  # kodabi-transcribe's native-engine features are off by default, so the
  # `lint`/`test` jobs' `--workspace` runs above never compile or lint them.
  # This matrixed job clippy-checks each feature with it turned on, so the FFI
  # glue can't silently rot between the rare times someone runs it locally:
  #
  #   * parakeet — sherpa-onnx, whose default `static` feature downloads a
  #     prebuilt archive (no cmake/C++ toolchain needed), so the only extra
  #     cost is that one-time (cached) download.
  #   * vad      — also sherpa-onnx (its bundled Silero VAD), standalone from
  #     parakeet's transducer bits. Checked as its own leg because `whisper`
  #     always co-enables `vad` (see Cargo.toml), which would otherwise mask a
  #     `vad`-only build ever failing to compile on its own.
  #   * whisper  — whisper.cpp via whisper-rs, compiled from source (CMake +
  #     bindgen/libclang), so it additionally needs the MSVC dev environment
  #     sourced (`ilammy/msvc-dev-cmd`, so bindgen finds the CRT headers) and
  #     LIBCLANG_PATH pointed at the runner image's bundled LLVM. Checks the
  #     CPU-only `whisper` feature, not `whisper-cuda` — runners have no NVIDIA
  #     GPU or CUDA toolkit, so the CUDA build can only be verified locally.
  #     Expect a slower first (uncached) run than parakeet/vad since there's a
  #     real C++ compile involved, plus it now also links sherpa-onnx (`vad` is
  #     a dependency of `whisper`, so this leg pulls the onnxruntime archive
  #     download on top of the whisper.cpp source build).
  #
  # Path-filtered to only fire on changes to the crate, and skips `--locked`'s
  # dist/ dependency — this crate never touches `tauri::generate_context!`.
  transcribe:
    name: Rust (${{ matrix.engine }} engine)
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Report every engine's results independently: one leg failing must not
      # cancel the others.
      fail-fast: false
      matrix:
        include:
          - engine: parakeet
            timeout: 25
            needs_msvc: false
          - engine: vad
            timeout: 25
            needs_msvc: false
          - engine: whisper
            timeout: 40
            needs_msvc: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes under crates/kodabi-transcribe
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # For a PR, diff against the PR base. For a push, diff against the
          # commit the push replaced (`github.event.before`), which covers every
          # commit in a multi-commit push — HEAD~1 would only look at the tip and
          # miss crate changes in earlier commits, silently skipping this gate.
          # Fall back to HEAD~1 only when neither is available (e.g. a brand-new
          # branch, whose `before` is the all-zero SHA). Run git diff outside the
          # `if` so a failure (e.g. an unreachable base) aborts under `set -e`
          # instead of being read as "no changes".
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed="$(git diff --name-only "$base" HEAD -- crates/kodabi-transcribe)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (stable) + clippy
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Set up MSVC dev environment (needed for bindgen to find CRT headers)
        if: matrix.needs_msvc && steps.changed.outputs.run == 'true'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Clippy (feature ${{ matrix.engine }} — strict, warnings fail)
        if: steps.changed.outputs.run == 'true'
        env:
          # Harmless for the parakeet leg (nothing reads it); required by
          # whisper-rs's bindgen build to locate libclang.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo clippy -p kodabi-transcribe --features ${{ matrix.engine }} --all-targets --locked -- -D warnings

  # kodabi-embed's `bge` backend (bge-small via fastembed/ONNX Runtime) is off
  # by default, so the `lint`/`test` jobs never compile it — same rationale as
  # the `transcribe` job above. No MSVC/bindgen step is needed (fastembed has no
  # C++ compile); the only extra cost is the one-time (cached) ONNX Runtime
  # binary download `ort-download-binaries` performs at build time. Skips
  # `--locked`'s dist/ dependency — this crate never touches
  # `tauri::generate_context!`.
  #
  # Path-filtered to the crate AND to `kodabi-core`: the `bge` backend
  # structurally depends on it (e.g. the `BGE_DIM == EMBEDDING_DIM` compile-time
  # assert), and since no default job compiles the `bge` feature, a core change
  # that breaks it would otherwise merge green.
  embed:
    name: Rust (embed backend)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes under crates/kodabi-embed or crates/kodabi-core
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # Same base-selection logic as the transcribe job: PR base, else the
          # commit the push replaced, else HEAD~1 for a brand-new branch.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed="$(git diff --name-only "$base" HEAD -- crates/kodabi-embed crates/kodabi-core)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (stable) + clippy
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Clippy (feature bge — strict, warnings fail)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy -p kodabi-embed --features bge --all-targets --locked -- -D warnings

  # The dev-profile half of the *shipping* configuration, which no other job
  # covers: `lint`/`test` run default features (the stub MockEngine), and
  # `transcribe` clippy-checks the engine crate alone, never the app that
  # forwards its features. Two things happen here:
  #
  #   1. the real-model integration tests run against the committed speech
  #      fixture, so CI proves audio actually transcribes with Parakeet rather
  #      than merely compiling;
  #   2. clippy lints src-tauri's `parakeet`-gated code (build_engine and
  #      friends), which the default `--workspace` legs cfg out.
  #
  # This is a separate job from `app` below, not two more steps in it, because
  # the two halves compile on different cargo profiles and so share essentially
  # no artifacts: sequencing them bought nothing and cost ~90s of critical
  # path. Running them side by side duplicates the runner setup but no compile,
  # and gives each its own rust-cache holding one profile instead of both.
  #
  # The two halves keep one identical path filter — the Rust surfaces plus this
  # workflow file, so edits to the jobs themselves are exercised. Frontend-only
  # changes skip both: the `dist` job already validates dist/, which is all
  # `tauri::generate_context!` needs. Both still need dist/ itself, since
  # `-p kodabi` compiles src-tauri either way.
  #
  # Only this half needs the models — nothing on the release side reads
  # PARAKEET_*. They are public sherpa-onnx release assets, cached across runs
  # under a static key since those assets are immutable.
  app-dev:
    name: App (Parakeet tests + clippy)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes to src-tauri, crates, or the workspace manifests
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # Same base-selection logic as the transcribe job: PR base, else the
          # commit the push replaced, else HEAD~1 for a brand-new branch.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed="$(git diff --name-only "$base" HEAD -- src-tauri crates Cargo.toml Cargo.lock .github/workflows/ci.yml)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (stable) + clippy
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Download dist/ (built by the dist job)
        if: steps.changed.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Parakeet + Silero VAD models
        if: steps.changed.outputs.run == 'true'
        id: models
        uses: actions/cache@v4
        with:
          path: .ci-models
          key: stt-parakeet-tdt-0.6b-v2-int8-silero-vad-v1
      - name: Download models (cache miss only)
        if: steps.changed.outputs.run == 'true' && steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Immutable release assets from the sherpa-onnx `asr-models` tag; the
          # cache key above is bumped by hand if either one is ever replaced.
          # bsdtar (the runner's `tar`) handles .tar.bz2 natively.
          base_url=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          mkdir -p .ci-models
          curl -fsSL --retry 3 -o parakeet.tar.bz2 \
            "$base_url/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2"
          tar xjf parakeet.tar.bz2 -C .ci-models
          rm parakeet.tar.bz2
          curl -fsSL --retry 3 -o .ci-models/silero_vad.onnx "$base_url/silero_vad.onnx"
      - name: Real transcription (Parakeet, real models, committed fixture)
        if: steps.changed.outputs.run == 'true'
        env:
          # Scoped to the parakeet_real target on purpose: the crate's other
          # #[ignore]d tests (benchmark_parakeet, benchmark_compare) need the
          # local-only meeting fixture (KODABI_BENCHMARK_MEETING_DIR) that is
          # deliberately never committed, and would fail here.
          PARAKEET_ENCODER: ${{ github.workspace }}/.ci-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/encoder.int8.onnx
          PARAKEET_DECODER: ${{ github.workspace }}/.ci-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/decoder.int8.onnx
          PARAKEET_JOINER: ${{ github.workspace }}/.ci-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/joiner.int8.onnx
          PARAKEET_TOKENS: ${{ github.workspace }}/.ci-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/tokens.txt
          PARAKEET_VAD_MODEL: ${{ github.workspace }}/.ci-models/silero_vad.onnx
        run: cargo test -p kodabi-transcribe --features parakeet --locked --test parakeet_real -- --ignored --nocapture
      - name: Clippy (app with parakeet — strict, warnings fail)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy -p kodabi --features parakeet --all-targets --locked -- -D warnings

  # The release-profile half: the app built exactly as it ships, plus the
  # assertion that the release guard still fires, so a featureless release build
  # can never quietly start succeeding again. Runs in parallel with `app-dev`
  # above, which is where the split, the shared path filter, and the reason the
  # models cache lives over there rather than here are all explained.
  app:
    name: App (release + Parakeet)
    runs-on: windows-latest
    timeout-minutes: 40
    needs: dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes to src-tauri, crates, or the workspace manifests
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # Same base-selection logic as the transcribe job: PR base, else the
          # commit the push replaced, else HEAD~1 for a brand-new branch. Kept
          # identical to the app-dev job's: the two halves must run or skip
          # together, or a Rust change could land with only half of the shipping
          # configuration checked.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed="$(git diff --name-only "$base" HEAD -- src-tauri crates Cargo.toml Cargo.lock .github/workflows/ci.yml)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (stable) + clippy
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Download dist/ (built by the dist job)
        if: steps.changed.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release build (the shipping configuration)
        if: steps.changed.outputs.run == 'true'
        run: cargo build -p kodabi --release --locked --features parakeet
      - name: Guard check (a featureless release build must not compile)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          # The grep string mirrors the compile_error! in
          # src-tauri/src/transcribe.rs. Reword one and this must change too.
          if cargo build -p kodabi --release --locked 2> guard.log; then
            echo "FAIL: expected the no-engine release build to be rejected by the compile_error guard"
            cat guard.log
            exit 1
          fi
          grep -q "release builds must ship a real STT engine" guard.log || {
            echo "FAIL: the release build failed, but not with the engine guard:"
            cat guard.log
            exit 1
          }

  # Drives the real app window over CDP — the only tier that crosses the real
  # IPC bridge, so the only one that can catch an unwired control. Deliberately
  # NOT a required check yet; see the promotion criteria in
  # docs/UI_E2E_HARNESS.md. It copies the in-job change gate the two app jobs
  # use so the check always reports, which is what lets it be promoted with no
  # YAML change.
  e2e:
    name: UI (E2E, quick capture)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes to the frontend, the shell, or the harness
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # Same base-selection logic as the app jobs: PR base, else the commit
          # the push replaced, else HEAD~1 for a brand-new branch.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          # `src` is in this list and not in the app jobs': catching a
          # frontend-side wiring regression is the entire point of this tier.
          changed="$(git diff --name-only "$base" HEAD -- src src-tauri crates e2e Cargo.toml Cargo.lock .github/workflows/ci.yml)"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Node (the harness needs a global WebSocket)
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rust (stable)
        if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
      - name: Download dist/ (built by the dist job)
        # Also sidesteps the local build-order trap: dist/ is embedded at
        # compile time, so it must exist and be current before cargo runs.
        if: steps.changed.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build the debug app with embedded assets
        # tauri/custom-protocol flips tauri's `dev` cfg off, so the exe serves
        # dist/ from http://tauri.localhost rather than expecting a Vite dev
        # server. Debug profile keeps MockEngine: no models, no native STT deps.
        # e2e/build.mjs also merges in tauri.e2e.conf.json's additionalBrowserArgs
        # (the CDP debug port, baked in at compile time) — the runtime
        # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS env var this job used to rely on
        # is silently ignored on this runner image.
        if: steps.changed.outputs.run == 'true'
        run: node e2e/build.mjs
      - name: Run the end-to-end slice
        # No pnpm install: the harness is Node built-ins only.
        if: steps.changed.outputs.run == 'true'
        run: node --test "e2e/**/*.test.mjs"
      - name: Reap any surviving app or WebView2 processes
        if: always()
        shell: bash
        run: |
          taskkill //F //IM kodabi.exe //T || true
          taskkill //F //IM msedgewebview2.exe //T || true
