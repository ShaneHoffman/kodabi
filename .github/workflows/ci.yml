name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save Windows minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (strict — warnings fail)
        run: pnpm exec eslint . --max-warnings=0
      - name: Build (typecheck + Vite)
        run: pnpm build

  # clippy and test each force a full dependency recompile (clippy compiles
  # through the clippy-driver wrapper, which doesn't share a cache fingerprint
  # with a plain rustc build), so they run as separate parallel jobs instead
  # of sequential steps in one job — otherwise every run pays for both full
  # compiles back-to-back instead of overlapping them.
  #
  # CI does not build the Tauri app — the release compile is the slowest step
  # and this workspace has no tests yet to justify it as a per-push cost.
  # Whether the desktop app itself builds is verified by the /pull-request
  # skill before a PR is opened or updated (see .claude/skills/pull-request).
  lint:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate dist/ for generate_context!)
        run: pnpm build
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (strict — warnings fail)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust (test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate dist/ for generate_context!)
        run: pnpm build
      - name: Test
        run: cargo test --workspace --locked
