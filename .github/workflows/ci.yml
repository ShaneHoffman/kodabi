name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on PR branches to save Windows minutes, but never
# cancel a run on main — that run builds and uploads the installer, and
# back-to-back merges would otherwise lose a commit's release verification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (strict — warnings fail)
        run: pnpm exec eslint . --max-warnings=0
      - name: Build (typecheck + Vite)
        run: pnpm build

  # fmt/clippy/test and the Tauri build share one job so the checkout, pnpm
  # install, frontend build, and rust-cache scope are paid once instead of
  # twice. The `--locked` clippy/test steps run before the Tauri build, so any
  # Cargo.lock drift fails here before the (unlocked) build ever runs.
  rust:
    name: Rust (fmt + clippy + test + Tauri build)
    runs-on: windows-latest
    # Cold-cache Tauri builds on Windows compile the full dependency tree twice
    # (dev for clippy/test, release for the build) — 30 min was too tight and a
    # timeout would leave the cache unsaved, stranding every later run too.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate dist/ for generate_context!)
        run: pnpm build
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (strict — warnings fail)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Tauri build only runs on push to main — the release compile is the
      # slowest step, and fmt/clippy/test already gate PRs on code correctness.
      - name: Build app + installer (main only)
        if: github.event_name == 'push'
        run: pnpm tauri build
      - name: Upload installer artifact (main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kodama-windows-installer
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          # Fail loudly if bundling produced no installer — an empty artifact
          # would silently defeat "the release path is verified".
          if-no-files-found: error
