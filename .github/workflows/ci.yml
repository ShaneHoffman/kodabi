name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on PR branches to save Windows minutes, but never
# cancel a run on main — that run builds and uploads the installer, and
# back-to-back merges would otherwise lose a commit's release verification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (strict — warnings fail)
        run: pnpm exec eslint . --max-warnings=0
      - name: Build (typecheck + Vite)
        run: pnpm build

  # clippy and test each force a full dependency recompile (clippy compiles
  # through the clippy-driver wrapper, which doesn't share a cache fingerprint
  # with a plain rustc build), so they run as separate parallel jobs instead
  # of sequential steps in one job — otherwise every run pays for both full
  # compiles back-to-back instead of overlapping them.
  lint:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate dist/ for generate_context!)
        run: pnpm build
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (strict — warnings fail)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust (test)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (generate dist/ for generate_context!)
        run: pnpm build
      - name: Test
        run: cargo test --workspace --locked

  # Only runs on push to main — the release compile is the slowest step, and
  # fmt/clippy/test already gate PR correctness. Runs in parallel with lint/
  # test rather than after them: on the rare case main itself fails lint/test,
  # this job's compute is wasted, but that's cheaper than always serializing
  # the release build behind two full dev-profile compiles.
  tauri:
    name: Tauri build (Windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app + installer
        run: pnpm tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodama-windows-installer
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          # Fail loudly if bundling produced no installer — an empty artifact
          # would silently defeat "the release path is verified".
          if-no-files-found: error
