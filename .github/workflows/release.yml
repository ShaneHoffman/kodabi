name: Release

# Deliberately a separate file from ci.yml rather than another job in it. Every
# job `name:` in ci.yml doubles as a *required status check context* in the
# repo's "main protection" ruleset, and that ruleset lives outside the tree — a
# job added there would either sit unrequired (fine but confusing) or, once
# required, permanently block every PR to main on a check that only ever runs
# for tags. Tag-triggered work lives here, where the ruleset never looks.
on:
  push:
    tags: ['v*']

# Tags are pushed by hand and each one is a distinct artifact; a re-pushed tag
# should re-run rather than cancel, so there is no `concurrency` block here.

permissions:
  # contents: needed to create the draft release and upload the installer to it.
  # Every other workflow in this repo is contents: read.
  # id-token: lets azure/login mint an OIDC token for code signing. Harmless
  # when the signing variables are unset and the login step is skipped.
  contents: write
  id-token: write

jobs:
  release:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    # The `release` environment exists for exactly one reason: it makes this
    # job's OIDC subject the stable `repo:<owner>/kodabi:environment:release`.
    # Azure federated credentials cannot wildcard a ref, and a tag push claims
    # `repo:<owner>/kodabi:ref:refs/tags/v0.1.0` — a different subject for every
    # release, none of which can be registered in advance. It carries no
    # protection rules and gates nothing; renaming it breaks signing.
    environment: release
    # The release compile is the slowest thing in the repo: a from-scratch build
    # of the whole workspace plus sherpa-onnx and ONNX Runtime, then NSIS
    # packaging. CI's `app` job budgets 40 minutes for the compile alone on a
    # warm rust-cache; this one may start cold.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # First, before any toolchain setup: a tag whose version does not match
      # the tree is a mistake worth catching in seconds rather than after an
      # hour of compiling. `version` is duplicated in package.json and
      # tauri.conf.json (tauri reads the latter; the former names the npm
      # package), so both are checked. node is preinstalled on the runner
      # image, so this runs before setup-node.
      - name: Assert the tag matches the version in the tree
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag package.json=$pkg tauri.conf.json=$conf"
          fail=0
          if [ "$tag" != "$pkg" ]; then
            echo "FAIL: tag $GITHUB_REF_NAME implies version $tag, but package.json says $pkg"
            fail=1
          fi
          if [ "$tag" != "$conf" ]; then
            echo "FAIL: tag $GITHUB_REF_NAME implies version $tag, but src-tauri/tauri.conf.json says $conf"
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "Bump both versions (or delete and re-push the tag) so a stale version cannot ship."
            exit 1
          fi

      # Beside the version assertion, and for the same reason: fail in seconds,
      # not after an hour. Unlike the Azure signing below — which is optional
      # and skips cleanly — updater signing is not allowed to be absent. Every
      # installed copy verifies the next update against the pubkey baked into
      # tauri.conf.json, so a release that shipped without its .sig and
      # latest.json is not merely unsigned: it is invisible to every app in the
      # field, silently, until someone thinks to look. A red build is the
      # cheaper failure by a wide margin.
      #
      # The pubkey is checked here too. It is committed, so the danger is not
      # that it goes missing but that a placeholder ships and produces installs
      # that can never verify anything again.
      - name: Assert the updater signing configuration is real
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$HAS_KEY" != "true" ] || [ "$HAS_PASSWORD" != "true" ]; then
            echo "FAIL: TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD are not both set."
            echo "Generate with 'pnpm tauri signer generate' and set both as repository secrets."
            fail=1
          fi
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          # A real minisign public key is base64 that decodes to the "untrusted
          # comment" header plus the key; anything short or placeholder-shaped
          # is not one.
          case "$pubkey" in
            REPLACE_WITH_*|"")
              echo "FAIL: plugins.updater.pubkey in src-tauri/tauri.conf.json is still a placeholder."
              fail=1
              ;;
          esac
          if [ "${#pubkey}" -lt 40 ]; then
            echo "FAIL: plugins.updater.pubkey is too short to be a minisign public key."
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "Updates are verified against this key. Shipping a wrong one strands every install."
            exit 1
          fi
          echo 'Updater signing key and pubkey are present.'

      # Toolchain setup mirrors ci.yml: same pnpm major, same node, same Rust
      # action and cache. Keep the versions in lockstep with that file.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # `pnpm tauri:build` is the canonical definition of what a release
      # compiles (`--features parakeet,embed`) — deliberately invoked as the
      # script rather than spelling the features out again here, so this file
      # can never drift from package.json. It runs the config's
      # beforeBuildCommand first (`pnpm mcp:build:release && pnpm build`),
      # which release-builds kodabi-mcp and produces the dist/ that
      # tauri::generate_context! embeds, then bundles the NSIS installer into
      # target/release/bundle/nsis/.
      #
      # It is split in two here, and the split is load-bearing. Signing runs at
      # the *end* of the bundle, on credentials `azure/login` mints from a
      # single-use OIDC assertion: an access token that lives roughly an hour
      # and cannot be refreshed. A cold compile alone can outlast that. So the
      # slow part runs first with no credentials in play, and the second
      # invocation — an incremental recompile plus NSIS packaging, minutes on a
      # warm target/ — happens right after the login. `--no-bundle` is the same
      # leg /pull-request already pays once per PR.
      - name: Compile the release (no bundling yet)
        run: pnpm tauri:build --no-bundle

      # Code signing (#159) — Azure Artifact Signing, secretless.
      #
      # Everything below is gated on vars.AZURE_CLIENT_ID: with no signing
      # configuration these steps skip, scripts/sign-windows.ps1 finds no
      # AZURE_SIGNING_* environment and no-ops per file, and the release ships
      # unsigned exactly as it did before. Configuration is six repository
      # *variables* (never secrets, never committed — the account and profile
      # names carry the validated legal publisher identity): AZURE_CLIENT_ID,
      # AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_CERT_PROFILE. No client secret
      # exists anywhere: the Azure federated credential trusts this repo's OIDC
      # token for the `release` environment above.
      - name: Azure login (OIDC, secretless)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # signtool signs through this dlib rather than a certificate in a store;
      # it authenticates via DefaultAzureCredential, which picks up the az
      # session the step above established. The version is pinned so a surprise
      # release cannot break a tag build — bump it deliberately.
      #
      # A .nupkg is a zip, so it is fetched and expanded directly rather than
      # through nuget.exe. That is one less tool to be present on the image, and
      # this step runs *after* the long compile: anything that fails here has
      # already cost the build an hour. x64 to match signtool's bitness.
      - name: Fetch the Artifact Signing dlib
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "$env:RUNNER_TEMP\artifact-signing-client.zip"
          $extracted = "$env:RUNNER_TEMP\artifact-signing"
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.128' -OutFile $package
          Expand-Archive -LiteralPath $package -DestinationPath $extracted -Force
          $dlib = Join-Path $extracted 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib)) {
            Write-Host "FAIL: dlib not found at $dlib"
            Get-ChildItem -Path $extracted -Recurse -Filter *.dll | ForEach-Object { $_.FullName }
            exit 1
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AZURE_SIGNING_DLIB=$dlib"

      # The bundle proper. bundle.windows.signCommand — set in the same overlay
      # config that adds the kodabi-mcp.exe resource, so a bare `tauri build`
      # and `pnpm tauri dev` never touch signing — runs
      # scripts/sign-windows.ps1 once per signable file: kodabi.exe, the NSIS
      # plugin DLLs, the bundled kodabi-mcp.exe, uninstall.exe, and the
      # installer itself.
      #
      # The extra --config is the updater overlay, and it is CI-only on purpose.
      # `createUpdaterArtifacts` makes the CLI sign the finished installer with
      # minisign, and it *fails the build* when TAURI_SIGNING_PRIVATE_KEY is
      # unset rather than skipping the way the Azure signing does. Putting it in
      # tauri.conf.json or tauri.bundle.conf.json would therefore break every
      # local `pnpm tauri:build` for want of a private key nobody should have on
      # their machine. The CLI merges --config flags in order, so this composes
      # with the bundle overlay the script already passes.
      #
      # Both signatures land on the same file, in the right order without being
      # asked: Authenticode during the bundle (signCommand), minisign after it.
      - name: Bundle and sign the NSIS installer (the shipping configuration)
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          # AZURE_SIGNING_DLIB arrives from the step above via GITHUB_ENV.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri:build --config src-tauri/tauri.updater.conf.json

      # Prove the signatures landed, on the artifact a user actually receives.
      # Worth its minute above all for uninstall.exe, which exists only once the
      # installer has run and whose signing rides an NSIS !uninstfinalize hook
      # invoked from a different working directory — the easiest link in the
      # chain to break silently. Installing on the runner beats unpacking the
      # installer, which depends on NSIS's compression staying legible to 7z.
      - name: Verify Authenticode signatures end to end
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          # NSIS per-user install mode; productName is the directory name.
          $installDir = Join-Path $env:LOCALAPPDATA 'Kodabi'
          if (-not (Test-Path -LiteralPath $installDir)) {
            Write-Host "FAIL: install directory not found at $installDir"
            exit 1
          }
          # Every PE the install laid down, whatever it is named — the main
          # binary's exact filename is the bundler's business, not this step's.
          $binaries = @(Get-ChildItem -Path $installDir -Recurse -Include *.exe, *.dll)
          foreach ($required in 'uninstall.exe', 'kodabi-mcp.exe') {
            if (-not ($binaries | Where-Object { $_.Name -eq $required })) {
              Write-Host "FAIL: expected $required under $installDir"
              exit 1
            }
          }
          $unsigned = 0
          foreach ($binary in @($installer) + $binaries) {
            $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
            '{0,-12} {1}' -f $signature.Status, $binary.FullName
            if ($signature.Status -ne 'Valid') { $unsigned++ }
          }
          if ($unsigned -gt 0) {
            Write-Host "FAIL: $unsigned file(s) have no valid Authenticode signature"
            exit 1
          }
          Write-Host 'Every shipped binary carries a valid signature.'

      # The update manifest. tauri-plugin-updater fetches exactly this file from
      # the endpoint in tauri.conf.json and compares its `version` against the
      # running build; `signature` is the *content* of the .sig the bundler just
      # produced, not a link to it, and the app verifies the downloaded
      # installer against it with the committed pubkey before running anything.
      #
      # Hand-rolled because this workflow is: tauri-action would generate it,
      # but adopting the action here would mean giving up the two-phase
      # compile-then-sign split that the OIDC token's lifetime forces.
      #
      # In v2 mode the installer .exe *is* the update payload — there is no
      # .zip. (An earlier note in this file said otherwise; that was the v1
      # `v1Compatible` shape, which we do not use.)
      - name: Generate latest.json for the updater
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dir=target/release/bundle/nsis
          installer="$(basename "$(ls "$dir"/*-setup.exe)")"
          if [ ! -f "$dir/$installer.sig" ]; then
            echo "FAIL: no updater signature at $dir/$installer.sig"
            echo "The bundle step should have produced it via createUpdaterArtifacts."
            ls -la "$dir" || true
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const [version, dir, installer] = process.argv.slice(1);
            const signature = fs.readFileSync(`${dir}/${installer}.sig`, "utf8").trim();
            if (!signature) throw new Error("the updater signature file is empty");
            const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}/${encodeURIComponent(installer)}`;
            const manifest = {
              version,
              // UTC, seconds precision, per .claude/rules/utc-timestamps.md.
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              platforms: { "windows-x86_64": { url, signature } },
            };
            fs.writeFileSync(`${dir}/latest.json`, JSON.stringify(manifest, null, 2) + "\n");
          ' "$version" "$dir" "$installer"
          echo "--- latest.json ---"
          cat "$dir/latest.json"

      # Upload to a *draft* release: a human reviews the assets and the
      # generated notes, then publishes. Split create-or-upload so a re-run
      # after a failed upload tops up the existing draft instead of erroring on
      # a duplicate release.
      #
      # Publishing that draft is also the moment the update goes live for
      # everyone already running Kodabi: the updater endpoint resolves through
      # `releases/latest/download/`, which ignores drafts entirely. So the
      # human review gate on the release doubles, exactly, as the rollout gate.
      - name: Upload the installer to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
          )
          for asset in "${assets[@]}"; do
            if [ ! -e "$asset" ]; then
              echo "FAIL: expected release asset missing: $asset"
              ls -la target/release/bundle/nsis/ || true
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Kodabi $GITHUB_REF_NAME" \
              --generate-notes \
              "${assets[@]}"
          fi
          echo "Draft release $GITHUB_REF_NAME is ready to review and publish."
