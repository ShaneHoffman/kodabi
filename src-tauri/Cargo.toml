[package]
name = "kodabi"
description = "Kodabi: Windows-first desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kodabi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` backs `app.security.assetProtocol` in tauri.conf.json: the
# note view streams a retained recording (`sessions/*.wav`) through the asset
# protocol rather than a byte-shuttling IPC command.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
# The capture-start toast (FOUNDING_DOC §3.7): fired from the Rust shell, not a
# webview, so it still appears when the window is hidden to the tray.
tauri-plugin-notification = "2"
kodabi-core = { path = "../crates/kodabi-core" }
kodabi-audio = { path = "../crates/kodabi-audio" }
kodabi-aec = { path = "../crates/kodabi-aec" }
kodabi-transcribe = { path = "../crates/kodabi-transcribe", optional = true }
kodabi-embed = { path = "../crates/kodabi-embed", optional = true }
kodabi-llm = { path = "../crates/kodabi-llm" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Resolves the real app directories before an `AppHandle` exists, so the dev
# sandbox (`src/sandbox.rs`) can compute the paths it must stay out of. Tauri
# derives `app_data_dir()`/`app_config_dir()` from this same crate, so the two
# agree by construction. Already in the tree via Tauri's stack.
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chat session ids: `claude --session-id` requires a valid UUID, and the chat
# id doubles as that session id (`chat_cmds`). Already in the tree via Tauri's
# stack, so this adds no new crate.
uuid = { version = "1", features = ["v4"] }
# Reads/writes Explorer's per-icon `NotifyIconSettings` so the tray mark sits
# on the taskbar rather than the overflow flyout (see `tray_promotion`). Already
# in the tree via Tauri's stack, so this adds no new crate.
winreg = "0.55"
# The embedded terminal's PTY (Phase 3, `terminal_cmds`): a cross-platform
# pseudo-terminal that uses ConPTY on Windows to host the interactive `claude`
# process. The first PTY in the tree.
portable-pty = "0.9"
# Raw PTY bytes cross the IPC boundary base64-encoded (a per-chunk lossy UTF-8
# decode would corrupt multibyte sequences split across reads); xterm's decoder
# reassembles them on the frontend. See `terminal_cmds`.
base64 = "0.22"

[features]
default = []
# Forward to `kodabi-transcribe`'s own mutually-exclusive engine features (see
# that crate's Cargo.toml for the static/shared link-mode conflict that keeps
# `parakeet` and `whisper` from ever being enabled together in one binary).
# Neither is on by default, so a debug build transcribes with
# `kodabi_core::transcription::MockEngine` and stays native-dependency-free.
# A *release* build with neither feature fails to compile on purpose (the
# `compile_error!` guard in `src/transcribe.rs`), so a mock engine can never
# ship; release builds pass `--features parakeet,embed` (`pnpm tauri:build`).
parakeet = ["dep:kodabi-transcribe", "kodabi-transcribe/parakeet"]
whisper = ["dep:kodabi-transcribe", "kodabi-transcribe/whisper"]
# Forward to `kodabi-embed`'s `bge` backend. Off by default, so the default
# build indexes notes for full-text search but writes no vectors (the
# `IndexState` carries no embedder). Enabling it compiles the ONNX Runtime and
# populates `notes_vec` on note write/edit. Unlike the engine features there is
# no `compile_error!` guard forcing it on for a release build — the
# `tauri:build` script in package.json is the only thing pinning it into what
# ships, so semantic search would go quietly missing if it were dropped there.
embed = ["dep:kodabi-embed", "kodabi-embed/bge"]
