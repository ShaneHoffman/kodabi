[package]
name = "kodama-transcribe"
description = "Kodama transcription engines — Parakeet TDT via sherpa-onnx."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kodama-core = { path = "../kodama-core" }
# `static` (sherpa-onnx's default feature) links onnxruntime + sherpa-onnx into
# the binary, so no runtime DLLs need bundling with the Tauri app. The first
# build with `--features parakeet` downloads a prebuilt archive unless
# SHERPA_ONNX_LIB_DIR points at libs already on disk; no cmake/C++ toolchain
# is required either way.
sherpa-onnx = { version = "1.13.4", optional = true }

[features]
default = []
parakeet = ["dep:sherpa-onnx"]

[dev-dependencies]
hound = "3"
