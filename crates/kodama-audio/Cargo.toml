[package]
name = "kodama-audio"
description = "Kodama audio capture — WASAPI loopback (system audio) and microphone via cpal."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cpal = "0.18"
crossbeam-channel = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Live resampling in the combiner (mic/system -> a common rate, with a
# runtime-adjustable ratio for clock-drift correction).
rubato = "4"
# Zero-copy buffer views rubato's `process_into_buffer` reads/writes through.
audioadapter-buffers = "4"

# cpal 0.18.1 declares its own `windows-core = ">=0.61,<=0.62"` dependency
# separate from its `windows` dependency, which Tauri's stack pins to 0.61.2
# transitively. Left unconstrained, Cargo resolves cpal's direct edge to the
# newest allowed 0.62.2 instead of reusing 0.61.2, producing two
# incompatible `windows-core` instances in the graph. Pin it so both edges
# unify onto the version Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"

[dev-dependencies]
serde_json = "1"
# Stereo WAV write/read: the hardware-gated two-channel test's tangible
# verification artifact, and the `record_meeting` example's output format.
# Runtime persistence is a separate ticket (`feat/persist-raw-session`), so
# this stays a dev-dependency rather than shipping in the app.
hound = "3.5"
tempfile = "3"
